name: Supabase keep-alive

# O plano gratuito do Supabase pausa o projeto após 7 dias sem atividade.
# Este job faz uma consulta leve ao banco a cada 3 dias para ele nunca pausar,
# mesmo que ninguém abra o sistema.

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consulta o banco
        run: |
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' src/lib/supabase.ts | head -n1)
          KEY=$(grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' src/lib/supabase.ts | head -n1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Não achei a URL/chave do Supabase em src/lib/supabase.ts"
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/org_settings?select=org_id&limit=1")
          echo "Resposta do Supabase: $STATUS"
          if [ "$STATUS" != "200" ]; then
            exit 1
          fi
